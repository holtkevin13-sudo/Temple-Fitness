<style>
:root{
  /* Temple Fitness — plum + gold + rose on clean white.
     Token names kept from the parent theme; values remapped to a light palette.
     "green-*" now = surface/white layers; "parch/ink" now = plum text on light. */
  --green-900:#ffffff; --green-800:#ffffff; --green-700:#fdfbfc; --green-600:#f7f0f4;
  --plum:#6b3a5b; --plum-dk:#4e2a43; --rose:#b87a93; --rose-soft:#d9b3c4;
  --gold:#c9a24b; --gold-bright:#d8b65f; --gold-dim:#a8842f;
  --parch:#4e2a43; --parch-dim:#8a6a7c; --char:#ffffff;
  --ink:#5a4150; --ink-soft:#8a7480;
  --green:#5b8c5a; --yellow:#c9a24b; --orange:#c47a3a; --red:#b5546a;
  --frame:rgba(107,58,91,.30); --frame-soft:rgba(107,58,91,.13);
  --shadow:0 6px 22px rgba(107,58,91,.12);
  --safe-t:env(safe-area-inset-top); --safe-b:env(safe-area-inset-bottom);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:#ffffff;
  background-image:radial-gradient(ellipse at 50% -8%, #faf2f6 0%, #ffffff 50%, #fdfafc 100%);
  color:var(--ink); font-family:'EB Garamond',Georgia,serif; font-size:17px; line-height:1.5;
  overflow-x:hidden; -webkit-font-smoothing:antialiased;
}
.app{max-width:520px;margin:0 auto;min-height:100%;padding-bottom:calc(76px + var(--safe-b))}
h1,h2,h3,.cz{font-family:'Cinzel',serif}
button{font-family:inherit;cursor:pointer;color:inherit;background:none;border:none}
.hide{display:none!important}

/* ---- top bar ---- */
.topbar{position:sticky;top:0;z-index:40;padding:calc(var(--safe-t) + 12px) 18px 12px;
  background:linear-gradient(to bottom, #ffffff 70%, transparent);
  display:flex;align-items:center;gap:11px}
.crest{width:34px;height:34px;flex:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
.topttl{font-size:15px;letter-spacing:.16em;color:var(--gold);font-weight:600;text-transform:uppercase}
.topsub{font-size:11px;letter-spacing:.34em;color:var(--ink-soft);text-transform:uppercase;margin-top:1px}

/* ---- views ---- */
.view{padding:6px 18px 30px;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.eyebrow{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold-dim);margin-bottom:6px}
.vtitle{font-size:25px;color:var(--plum);letter-spacing:.02em;line-height:1.15;margin-bottom:3px}
.divider{display:flex;align-items:center;gap:10px;margin:22px 0 14px;color:var(--gold-dim)}
.divider::before,.divider::after{content:"";height:1px;flex:1;background:linear-gradient(to right,transparent,var(--frame),transparent)}
.divider span{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold-dim)}
.diamond{color:var(--gold);font-size:9px}

/* ---- cards ---- */
.card{position:relative;background:#ffffff;
  border:1px solid var(--frame-soft);border-radius:5px;padding:18px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card.framed{border:1px solid var(--frame)}
.card.framed::before{content:"";position:absolute;inset:5px;border:1px solid var(--frame-soft);border-radius:3px;pointer-events:none}
.card-in{position:relative;z-index:1}
.ck{font-family:'Cinzel',serif;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--plum);margin-bottom:10px}

/* ---- readiness ---- */
.ready-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ready-btn{border:1px solid var(--frame-soft);border-radius:5px;padding:15px 12px;text-align:left;
  background:#faf4f7;transition:transform .12s,border-color .2s;position:relative;overflow:hidden}
.ready-btn:active{transform:scale(.97)}
.ready-btn .dot{width:13px;height:13px;border-radius:50%;display:inline-block;margin-bottom:8px;box-shadow:0 0 10px currentColor}
.ready-btn h3{font-size:15px;letter-spacing:.12em;color:var(--plum);text-transform:uppercase}
.ready-btn p{font-size:13.5px;color:var(--ink-soft);margin-top:3px;font-family:'EB Garamond'}
.ready-btn.sel{border-color:var(--gold);background:rgba(201,162,75,.1)}
.r-green{color:var(--green)} .r-yellow{color:var(--yellow)} .r-orange{color:var(--orange)} .r-red{color:var(--red)}

/* ---- workout block ---- */
.tier-tabs{display:flex;gap:6px;margin:4px 0 14px}
.tier-tab{flex:1;border:1px solid var(--frame-soft);border-radius:4px;padding:9px 4px;font-family:'Cinzel',serif;
  font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);background:#faf4f7;transition:.18s}
.tier-tab.on{color:#fff;background:var(--plum);border-color:var(--plum);font-weight:600}
.move-list{list-style:none}
.move-list li{padding:11px 0;border-bottom:1px solid var(--frame-soft);display:flex;align-items:flex-start;gap:11px;font-size:16.5px}
.move-list li:last-child{border-bottom:none}
.move-list li .bullet{color:var(--rose);flex:none;margin-top:.45em;font-size:7px}
.meta-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px}
.chip{font-size:11.5px;letter-spacing:.06em;color:var(--ink-soft);border:1px solid var(--frame-soft);
  border-radius:20px;padding:4px 11px;font-family:'Cinzel',serif;text-transform:uppercase}
.rule-note{margin-top:13px;padding:11px 13px;border-left:2px solid var(--gold);background:rgba(201,162,75,.07);
  font-style:italic;font-size:15px;color:var(--ink-soft);border-radius:0 4px 4px 0}
.marker{margin-top:14px;text-align:center;font-family:'Caveat',cursive;font-size:20px;color:var(--gold-bright);line-height:1.3}
.marker::before{content:"\201C"} .marker::after{content:"\201D"}

/* ---- primary action ---- */
.btn{display:block;width:100%;text-align:center;font-family:'Cinzel',serif;font-size:14px;letter-spacing:.16em;
  text-transform:uppercase;padding:15px;border-radius:5px;background:var(--gold);color:var(--char);font-weight:600;
  box-shadow:var(--shadow);transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--frame)}
.btn.sm{padding:11px;font-size:12px;margin-top:10px}
.btn-row{display:flex;gap:9px}.btn-row .btn{flex:1}

/* ---- progress / cycle ---- */
.cyc{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.cyc .big{font-family:'Cinzel',serif;font-size:30px;color:var(--gold);line-height:1}
.cyc .lbl{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft)}
.wk-track{display:flex;gap:4px;margin:14px 0 6px}
.wk-track .wk{flex:1;height:7px;border-radius:2px;background:rgba(255,255,255,.07)}
.wk-track .wk.done{background:var(--gold-dim)}
.wk-track .wk.cur{background:var(--gold);box-shadow:0 0 8px var(--gold)}
.phase-tag{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-dim);font-family:'Cinzel'}

/* ---- standards ---- */
.std{margin-bottom:16px}
.std-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.std-head .name{font-family:'Cinzel';font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--parch)}
.std-head .now{font-size:13px;color:var(--gold);font-family:'Cinzel'}
.std-bar{display:flex;gap:3px}
.std-seg{flex:1;text-align:center;padding:7px 2px;border-radius:3px;font-size:10.5px;font-family:'Cinzel';
  letter-spacing:.04em;background:rgba(0,0,0,.18);color:var(--ink-soft);border:1px solid transparent;line-height:1.25}
.std-seg .v{display:block;font-size:13px;color:var(--parch);margin-top:2px}
.std-seg.reached{background:rgba(201,162,75,.14);color:var(--gold);border-color:var(--frame-soft)}
.std-seg.atlvl{background:var(--gold);color:var(--char);border-color:var(--gold)}
.std-seg.atlvl .v{color:var(--char)}
.std-input{width:100%;margin-top:9px;background:rgba(0,0,0,.22);border:1px solid var(--frame-soft);border-radius:4px;
  color:var(--parch);padding:10px 12px;font-family:'EB Garamond';font-size:16px;text-align:center}
.std-input::placeholder{color:var(--ink-soft)}

/* ---- ladder ---- */
.ladder{list-style:none}
.ladder li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--frame-soft)}
.ladder li:last-child{border-bottom:none}
.rung-num{width:26px;height:26px;border-radius:50%;border:1px solid var(--frame);display:flex;align-items:center;
  justify-content:center;font-family:'Cinzel';font-size:12px;color:var(--gold-dim);flex:none}
.ladder li.done .rung-num{background:var(--gold);color:var(--char);border-color:var(--gold)}
.ladder li.cur .rung-num{border-color:var(--gold);color:var(--gold);box-shadow:0 0 8px var(--frame)}
.rung-body{flex:1}.rung-body .rn{font-family:'Cinzel';font-size:13.5px;letter-spacing:.08em;color:var(--parch)}
.rung-body .rt{font-size:13.5px;color:var(--ink-soft)}
.rung-check{width:24px;height:24px;border:1px solid var(--frame);border-radius:5px;flex:none;color:var(--gold);
  display:flex;align-items:center;justify-content:center;font-size:14px}
.ladder li.done .rung-check{background:rgba(201,162,75,.16)}

/* ---- library ---- */
.cat-scroll{display:flex;gap:7px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none;margin:0 -18px;padding-left:18px;padding-right:18px}
.cat-scroll::-webkit-scrollbar{display:none}
.cat-pill{flex:none;font-family:'Cinzel';font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  padding:8px 14px;border-radius:20px;border:1px solid var(--frame-soft);color:var(--ink-soft);background:#faf4f7;white-space:nowrap}
.cat-pill.on{background:var(--gold);color:var(--char);border-color:var(--gold);font-weight:600}
.wo-item{display:flex;align-items:center;gap:13px;padding:14px 15px;background:#ffffff;
  border:1px solid var(--frame-soft);border-radius:5px;margin-bottom:9px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.wo-num{font-family:'Cinzel';font-size:13px;color:var(--gold-dim);width:30px;flex:none}
.wo-body{flex:1;min-width:0}
.wo-body .wn{font-family:'Cinzel';font-size:15px;color:var(--parch);letter-spacing:.03em}
.wo-body .wm{font-size:13px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wo-arrow{color:var(--gold-dim);flex:none}

/* ---- log / forms ---- */
.field{margin-bottom:13px}
.field label{display:block;font-family:'Cinzel';font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-dim);margin-bottom:5px}
.field input,.field textarea,.field select{width:100%;background:rgba(0,0,0,.22);border:1px solid var(--frame-soft);
  border-radius:4px;color:var(--parch);padding:11px 12px;font-family:'EB Garamond';font-size:16px}
.field textarea{min-height:84px;resize:vertical;line-height:1.5}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--gold)}
.chk-row{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--frame-soft)}
.chk-row:last-of-type{border-bottom:none}
.chk-box{width:26px;height:26px;border:1px solid var(--frame);border-radius:5px;flex:none;display:flex;
  align-items:center;justify-content:center;color:var(--gold);font-size:15px;background:#f7eef3}
.chk-row.on .chk-box{background:var(--gold);color:var(--char);border-color:var(--gold)}
.chk-row .cl{font-size:16px;color:var(--parch)}
.log-entry{padding:13px 0;border-bottom:1px solid var(--frame-soft)}
.log-entry .le-date{font-family:'Cinzel';font-size:11px;letter-spacing:.14em;color:var(--gold-dim);text-transform:uppercase}
.log-entry .le-body{font-size:15.5px;color:var(--ink);margin-top:3px}
.empty{text-align:center;padding:30px 16px;color:var(--ink-soft)}
.empty .em-mk{font-family:'Caveat';font-size:22px;color:var(--gold-dim);margin-top:8px}

/* ---- manual reading ---- */
.read h3{color:var(--gold);font-size:16px;letter-spacing:.1em;margin:20px 0 8px;text-transform:uppercase}
.read p{margin-bottom:11px;color:var(--ink);font-size:16.5px}
.read .verse{font-style:italic;color:var(--ink-soft);text-align:center;margin:14px 0;font-size:16px}
.read ol,.read ul{margin:0 0 12px 4px;list-style:none}
.read ol li,.read ul li{padding:6px 0;font-size:16.5px;display:flex;gap:10px}
.read ol li .n{font-family:'Cinzel';color:var(--gold);flex:none}
.accordion{border:1px solid var(--frame-soft);border-radius:5px;margin-bottom:10px;overflow:hidden;background:rgba(0,0,0,.12)}
.acc-head{display:flex;justify-content:space-between;align-items:center;padding:15px 16px;font-family:'Cinzel';
  font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--parch)}
.acc-head .ch{color:var(--gold);transition:transform .25s}
.accordion.open .acc-head .ch{transform:rotate(45deg)}
.acc-body{max-height:0;overflow:hidden;transition:max-height .3s ease}
.acc-body-in{padding:0 16px 16px}

/* ---- bottom nav ---- */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:50;display:flex;justify-content:center;
  background:linear-gradient(to top,var(--green-900) 70%,transparent);padding:8px 0 calc(8px + var(--safe-b))}
.nav-in{display:flex;max-width:520px;width:100%;justify-content:space-around}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 12px;color:var(--ink-soft);flex:1}
.nav-btn .ni{width:23px;height:23px}
.nav-btn .nl{font-family:'Cinzel';font-size:9.5px;letter-spacing:.12em;text-transform:uppercase}
.nav-btn.on{color:var(--gold)}
.nav-btn.on .ni{filter:drop-shadow(0 0 5px var(--frame))}

/* ---- modal ---- */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(8,12,9,.74);display:flex;align-items:flex-end;
  justify-content:center;animation:fade .25s}
.sheet{background:#ffffff;border:1px solid var(--frame);
  border-radius:14px 14px 0 0;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;padding:8px 18px calc(24px + var(--safe-b));
  animation:rise .3s ease;box-shadow:0 -10px 40px rgba(0,0,0,.5)}
@keyframes rise{from{transform:translateY(100%)}to{transform:none}}
.grab{width:38px;height:4px;background:var(--frame);border-radius:3px;margin:8px auto 14px}
.toast{position:fixed;bottom:calc(90px + var(--safe-b));left:50%;transform:translateX(-50%);z-index:80;
  background:var(--gold);color:var(--char);font-family:'Cinzel';font-size:12px;letter-spacing:.1em;text-transform:uppercase;
  padding:11px 20px;border-radius:30px;box-shadow:var(--shadow);animation:fade .25s}
.prompt-banner{background:linear-gradient(120deg,rgba(201,162,75,.18),rgba(201,162,75,.06));
  border:1px solid var(--frame);border-radius:5px;padding:13px 15px;margin-bottom:14px;display:flex;gap:11px;align-items:center}
.prompt-banner .pi{font-size:20px;flex:none}
.prompt-banner .pt{font-size:14.5px;color:var(--parch)}
.prompt-banner .pt b{color:var(--gold)}

/* splash */
#splash{position:fixed;inset:0;z-index:100;background:var(--green-800);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:18px;transition:opacity .6s}
#splash.gone{opacity:0;pointer-events:none}
#splash .cr{width:120px;height:120px;animation:crIn 1s ease}
@keyframes crIn{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
#splash .st{font-family:'Cinzel';font-size:19px;letter-spacing:.3em;color:var(--gold);text-transform:uppercase}
#splash .ss{font-family:'Caveat';font-size:19px;color:var(--ink-soft)}

/* ===== accessibility ===== */
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}#splash .cr{animation:none}}
button:focus-visible,input:focus-visible,textarea:focus-visible,.ready-btn:focus-visible,.tier-tab:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ===== segment control ===== */
.segment{display:flex;gap:5px;background:#f7eef3;border:1px solid var(--frame-soft);border-radius:6px;padding:4px;margin:6px 0 16px}
.seg-btn{flex:1;padding:9px 4px;font-family:'Cinzel',serif;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);border-radius:4px;transition:.18s}
.seg-btn.on{background:var(--gold);color:var(--char);font-weight:600}

/* ===== roster ===== */
.roster{margin:14px 0 4px}
.roster-lbl{font-family:'Cinzel';font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-dim);margin-bottom:7px}
.roster-chips{display:flex;gap:7px;flex-wrap:wrap}
.rchip{font-family:'Cinzel';font-size:11.5px;letter-spacing:.06em;padding:7px 13px;border-radius:20px;border:1px solid var(--frame-soft);color:var(--ink-soft);background:#faf4f7}
.rchip.on{background:rgba(201,162,75,.16);color:var(--gold);border-color:var(--gold)}
.rchip.locked{opacity:.9;border-color:var(--gold);color:var(--gold)}

/* ===== session screen ===== */
.sess-back{font-family:'Cinzel';font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);padding:6px 0;margin-bottom:2px}
.lasttime{font-size:13.5px;color:var(--ink-soft);font-style:italic;background:#faf4f7;border-radius:5px;padding:9px 12px;margin:10px 0 4px;border-left:2px solid var(--frame)}
.mv{display:flex;flex-direction:column;gap:4px;flex:1}
.mv-other{font-size:13.5px;color:var(--ink-soft)}
.mv-other b{color:var(--gold-dim);font-family:'Cinzel';font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin-right:5px}

/* ===== timer ===== */
.timer-card{padding:18px 16px}
.timer-modes{display:flex;gap:6px;margin-bottom:16px}
.timer-modes .tm{flex:1;padding:9px 4px;font-family:'Cinzel';font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);border:1px solid var(--frame-soft);border-radius:4px;background:#faf4f7}
.timer-modes .tm.on{background:var(--gold);color:var(--char);border-color:var(--gold);font-weight:600}
.timer-ring{position:relative;width:190px;height:190px;margin:6px auto 14px;border-radius:50%;border:2px solid var(--frame);
  display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,rgba(201,162,75,.06),transparent 70%);transition:border-color .3s,box-shadow .3s}
.timer-ring.work{border-color:var(--green);box-shadow:0 0 22px rgba(91,140,90,.45)}
.timer-ring.rest{border-color:var(--orange);box-shadow:0 0 22px rgba(196,122,58,.4)}
.tphase{font-family:'Cinzel';font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-dim);margin-bottom:4px;height:14px}
.tdisp{font-family:'Cinzel';font-size:52px;color:var(--parch);line-height:1;font-variant-numeric:tabular-nums}
.timer-config{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.stepper{display:flex;align-items:center;gap:10px}
.st-lbl{font-family:'Cinzel';font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-dim);width:64px;flex:none}
.st-opts{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none}.st-opts::-webkit-scrollbar{display:none}
.st-o{flex:none;min-width:38px;padding:7px 8px;border:1px solid var(--frame-soft);border-radius:4px;color:var(--ink-soft);font-size:14px;background:#faf4f7}
.st-o.on{background:var(--gold);color:var(--char);border-color:var(--gold);font-weight:600}
.timer-ctrl{display:flex;gap:9px}.timer-ctrl .btn{flex:1;margin:0}.timer-ctrl #tstart{flex:2}

/* ===== timer bar (global) ===== */
.timerbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + var(--safe-b));z-index:55;
  width:calc(100% - 28px);max-width:492px;background:var(--green-700);border:1px solid var(--gold);border-radius:8px;
  display:flex;align-items:center;gap:10px;padding:11px 14px;box-shadow:var(--shadow)}
.tb-dot{width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold);animation:pulse 1.2s infinite;flex:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.tb-name{font-family:'Cinzel';font-size:12px;letter-spacing:.06em;color:var(--parch);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-time{font-family:'Cinzel';font-size:16px;color:var(--gold);font-variant-numeric:tabular-nums}
.tb-go{font-family:'Cinzel';font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);flex:none}

/* ===== year plan ===== */
.yr-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.yr-wk{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);font-family:'Cinzel'}
.yr-adv{font-family:'Cinzel';font-size:15px;color:var(--gold);letter-spacing:.04em;margin-bottom:5px}
.yr-note{font-size:14.5px;color:var(--ink-soft);margin-bottom:9px;line-height:1.45}
.phase-band{font-family:'Cinzel';font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-dim);margin:14px 0 6px;padding-bottom:5px;border-bottom:1px solid var(--frame-soft)}
.wk-row{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--frame-soft);align-items:baseline}
.wk-row.cur{background:rgba(201,162,75,.08);border-radius:4px;padding-left:8px;padding-right:8px;border-bottom-color:transparent}
.wk-row .wk-n{font-family:'Cinzel';font-size:14px;color:var(--gold);width:22px;flex:none}
.wk-row .wk-d{font-size:14.5px;color:var(--ink)}

/* ===== family ===== */
.mem-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.mem-name{font-family:'Cinzel';font-size:16px;letter-spacing:.06em;color:var(--parch)}
.test-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.test-cell{text-align:center;background:rgba(0,0,0,.18);border:1px solid var(--frame-soft);border-radius:4px;padding:9px 3px}
.tc-v{display:block;font-family:'Cinzel';font-size:17px;color:var(--gold)}
.tc-l{display:block;font-size:9.5px;letter-spacing:.04em;color:var(--ink-soft);margin-top:3px;line-height:1.2}
.trend-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--frame-soft)}
.tr-l{font-family:'Cinzel';font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);width:90px;flex:none}
.spk{display:flex;align-items:flex-end;gap:3px;flex:1;height:24px}
.spk i{flex:1;background:var(--gold-dim);border-radius:1px;min-height:4px}
.spk i:last-child{background:var(--gold)}
.tr-now{font-family:'Cinzel';font-size:15px;color:var(--gold);flex:none}


/* ===== v2: round counter ===== */
.round-counter{background:#f7eef3;border:1px solid var(--frame);border-radius:6px;padding:12px 14px;margin-bottom:12px}
.rc-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.rc-lbl{font-family:'Cinzel';font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-dim)}
.rc-pos{font-family:'Cinzel';font-size:24px;color:var(--gold)}.rc-pos i{font-size:15px;color:var(--ink-soft);font-style:normal}
.rc-track{display:flex;gap:4px;flex-wrap:wrap}
.rc-dot{width:13px;height:13px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid var(--frame-soft)}
.rc-dot.done{background:var(--gold-dim);border-color:var(--gold-dim)}
.rc-dot.cur{background:var(--gold);box-shadow:0 0 8px var(--gold);border-color:var(--gold)}
.round-ctrl{display:flex;gap:9px;margin-top:14px}.round-ctrl .btn{flex:1;margin:0}
.move-list.struct .mv-main{font-size:16.5px}
/* ===== feel selector ===== */
.feel-row{display:flex;gap:7px}
.feel-btn{flex:1;padding:12px 4px;font-family:'Cinzel';font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);border:1px solid var(--frame-soft);border-radius:5px;background:#faf4f7}
.feel-btn.on{background:var(--gold);color:var(--char);border-color:var(--gold);font-weight:600}
/* ===== week/cycle adjuster ===== */
.adjuster{display:flex;gap:7px;align-items:center;margin:10px 0}
.adj-btn{font-family:'Cinzel';font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-dim);border:1px solid var(--frame-soft);border-radius:4px;padding:8px 10px;background:#faf4f7}
.adj-btn.wide{flex:1}
.adj-pos{flex:1;text-align:center;font-family:'Cinzel';font-size:12px;letter-spacing:.06em;color:var(--parch)}
/* ===== murph ===== */
.murph-tot{display:flex;flex-direction:column;gap:14px;margin-top:6px}
.mt-head{display:flex;justify-content:space-between;font-family:'Cinzel';font-size:13px;letter-spacing:.08em;color:var(--parch);margin-bottom:5px;text-transform:uppercase}
.mt-num{color:var(--gold)}
.mt-bar{height:9px;background:#f2e6ec;border-radius:5px;overflow:hidden}
.mt-bar i{display:block;height:100%;background:linear-gradient(to right,var(--gold-dim),var(--gold));border-radius:5px;transition:width .3s}
.murph-add{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.ma-grp{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ma-l{font-size:14.5px;color:var(--ink)}.ma-l b{color:var(--gold);font-family:'Cinzel';margin-left:4px}
.ma-btns{display:flex;gap:5px}
.ma-btns button{font-family:'Cinzel';font-size:13px;color:var(--gold);border:1px solid var(--frame-soft);border-radius:4px;padding:7px 11px;background:#faf4f7;min-width:42px}


/* ===== v3: upscaled manual ===== */
.manual-title{text-align:center;padding:20px 0 8px}
.mt-crest{width:96px;height:96px;margin:0 auto 14px}
.mt-name{font-family:'Cinzel';font-size:30px;letter-spacing:.06em;color:var(--gold);font-weight:600;line-height:1}
.mt-rule{display:flex;align-items:center;justify-content:center;gap:12px;color:var(--gold);margin:12px 0 8px;font-size:10px}
.mt-rule span{height:1px;width:54px;background:linear-gradient(to right,transparent,var(--frame),transparent)}
.mt-sub{font-family:'Cinzel';font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--ink-soft)}
.mt-tag{font-family:'Caveat';font-size:21px;color:var(--gold-bright);margin-top:8px}
.creed-card{position:relative;border:1px solid var(--frame);border-radius:6px;padding:24px 20px;margin:18px 0 8px;
  background:radial-gradient(ellipse at 50% 0%,rgba(201,162,75,.07),transparent 70%),linear-gradient(160deg,var(--green-700),var(--green-800))}
.creed-card::before{content:"";position:absolute;inset:6px;border:1px solid var(--frame-soft);border-radius:3px;pointer-events:none}
.cc-head{font-family:'Cinzel';font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);text-align:center;margin-bottom:14px}
.creed-card p{text-align:center;font-size:16.5px;color:var(--ink);margin:3px 0;font-style:italic}
.cc-gap{height:10px}
.rules-list{display:flex;flex-direction:column;gap:1px}
.rule-row{display:flex;align-items:center;gap:14px;padding:13px 4px;border-bottom:1px solid var(--frame-soft)}
.rule-row:last-child{border-bottom:none}
.rr-n{font-family:'Cinzel';font-size:13px;color:var(--gold-dim);letter-spacing:.05em}
.rr-t{font-family:'Cinzel';font-size:15px;letter-spacing:.08em;color:var(--parch);text-transform:uppercase}
.pillar-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pillar{border:1px solid var(--frame-soft);border-radius:5px;padding:14px;background:#faf4f7}
.pl-name{font-family:'Cinzel';font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-bottom:5px}
.pl-desc{font-size:14px;color:var(--ink-soft);line-height:1.45}
.journey{position:relative;padding-left:8px}
.jstep{display:flex;gap:14px;padding:4px 0;position:relative}
.jstep::before{content:"";position:absolute;left:5px;top:0;bottom:0;width:1px;background:var(--frame)}
.jstep.first::before{top:50%}.jstep.last::before{bottom:50%}
.js-dot{width:11px;height:11px;border-radius:50%;background:var(--gold);border:2px solid var(--green-800);box-shadow:0 0 0 1px var(--gold);flex:none;margin-top:7px;z-index:1}
.js-body{display:flex;flex-direction:column;padding:6px 0 14px}
.js-when{font-family:'Cinzel';font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-dim)}
.js-what{font-size:16px;color:var(--parch);margin-top:2px}
.std-ladder{display:flex;flex-direction:column;gap:6px}
.sl-row{display:flex;align-items:baseline;gap:14px;padding:11px 14px;border:1px solid var(--frame-soft);border-radius:5px;background:linear-gradient(to right,rgba(201,162,75,.06),transparent)}
.sl-rank{font-family:'Cinzel';font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);width:96px;flex:none}
.sl-desc{font-size:14.5px;color:var(--ink-soft)}

/* ============ STATE + PERSISTENCE (IndexedDB) ============ */
const DB_NAME='temple_fitness',STORE='kv';
let _db=null;
function db(){return new Promise((res,rej)=>{if(_db)return res(_db);
  const r=indexedDB.open(DB_NAME,1);
  r.onupgradeneeded=e=>{e.target.result.createObjectStore(STORE)};
  r.onsuccess=e=>{_db=e.target.result;res(_db)};
  r.onerror=e=>rej(e)});}
async function kvGet(k){try{const d=await db();return new Promise((res)=>{const t=d.transaction(STORE,'readonly').objectStore(STORE).get(k);t.onsuccess=()=>res(t.result??null);t.onerror=()=>res(null)})}catch(e){return null}}
async function kvSet(k,v){try{const d=await db();return new Promise((res)=>{const t=d.transaction(STORE,'readwrite').objectStore(STORE).put(v,k);t.onsuccess=()=>res(true);t.onerror=()=>res(false)})}catch(e){return false}}

/* ============ GLOBAL TIMER ============ */
let TIMER={mode:null,running:false,t:0,target:60,work:40,rest:20,rounds:5,round:0,phase:'work',iv:null,wkName:'',wkRef:null};
let audioCtx=null;
function unlockAudio(){if(!audioCtx){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();}
function beep(freq,dur){if(!audioCtx)return;try{const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.frequency.value=freq;o.type='sine';o.connect(g);g.connect(audioCtx.destination);
  g.gain.setValueAtTime(.001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.35,audioCtx.currentTime+.02);
  g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);o.start();o.stop(audioCtx.currentTime+dur+.02);}catch(e){}}
function buzz(p){if(navigator.vibrate)navigator.vibrate(p);}
function timerTick(){
  if(TIMER.mode==='up'){TIMER.t++;}
  else if(TIMER.mode==='down'){TIMER.t--;if(TIMER.t<=0){timerStop();beep(880,.4);buzz(400);TIMER.t=0;}else if(TIMER.t<=3){beep(660,.12);buzz(80);}}
  else if(TIMER.mode==='interval'){TIMER.t--;
    if(TIMER.t<=0){
      if(TIMER.phase==='work'&&TIMER.rest>0){TIMER.phase='rest';TIMER.t=TIMER.rest;beep(440,.25);buzz([0,150,80,150]);}
      else{TIMER.round++;if(TIMER.round>=TIMER.rounds){timerStop();beep(880,.5);buzz(500);refreshTimerUI();return;}TIMER.phase='work';TIMER.t=TIMER.work;beep(880,.25);buzz(200);}
    } else if(TIMER.t<=3){beep(660,.1);}}
  refreshTimerUI();renderTimerBar();}
function timerStart(){if(TIMER.running||!TIMER.mode)return;TIMER.running=true;unlockAudio();beep(880,.15);TIMER.iv=setInterval(timerTick,1000);refreshTimerUI();renderTimerBar();}
function timerStop(){TIMER.running=false;if(TIMER.iv)clearInterval(TIMER.iv);TIMER.iv=null;refreshTimerUI();renderTimerBar();}
function timerReset(){timerStop();if(TIMER.mode==='up')TIMER.t=0;else if(TIMER.mode==='down')TIMER.t=TIMER.target;else if(TIMER.mode==='interval'){TIMER.t=TIMER.work;TIMER.round=0;TIMER.phase='work';}refreshTimerUI();}
function setTimerMode(mode,opts){opts=opts||{};TIMER.mode=mode;timerStop();
  if(mode==='up')TIMER.t=0;
  if(mode==='down'){TIMER.target=opts.target||TIMER.target;TIMER.t=TIMER.target;}
  if(mode==='interval'){TIMER.work=opts.work||TIMER.work;TIMER.rest=opts.rest!=null?opts.rest:TIMER.rest;TIMER.rounds=opts.rounds||TIMER.rounds;TIMER.round=0;TIMER.phase='work';TIMER.t=TIMER.work;}
  refreshTimerUI();}
function refreshTimerUI(){
  const disp=$('#tdisp');if(disp)disp.textContent=fmtClock(TIMER.t);
  const ph=$('#tphase');if(ph)ph.textContent=TIMER.mode==='interval'?(TIMER.phase==='work'?`Work \u00B7 Round ${Math.min(TIMER.round+1,TIMER.rounds)}/${TIMER.rounds}`:`Rest \u00B7 Round ${Math.min(TIMER.round+1,TIMER.rounds)}/${TIMER.rounds}`):(TIMER.mode==='up'?'Elapsed':TIMER.mode==='down'?'Countdown':'');
  const sb=$('#tstart');if(sb)sb.textContent=TIMER.running?'Pause':'Start';
  const ring=$('#tring');if(ring){ring.classList.toggle('work',TIMER.mode==='interval'&&TIMER.phase==='work'&&TIMER.running);ring.classList.toggle('rest',TIMER.mode==='interval'&&TIMER.phase==='rest'&&TIMER.running);}}
function renderTimerBar(){let bar=$('#timerbar');
  if(TIMER.running&&cur!=='session'){if(!bar){bar=el('div','timerbar');bar.id='timerbar';document.body.appendChild(bar);}
    bar.innerHTML=`<span class="tb-dot"></span><span class="tb-name">${esc(TIMER.wkName||'Workout')}</span><span class="tb-time">${fmtClock(TIMER.t)}</span><button class="tb-go">Resume \u203A</button>`;
    bar.querySelector('.tb-go').onclick=()=>{if(TIMER.wkRef)openSession(TIMER.wkRef);};
  } else if(bar)bar.remove();}

/* ============ ACTIVE WORKOUT SESSION ============ */
let SESSION=null;       // {type:'core',letter} | {type:'lib',id}
let SESS_ROUND=0;       // current round index for structured
let SESS_FEEL=null;     // Easy/Solid/Hard/Brutal
function structFor(ref){
  if(ref.type==='core')return CORE2[ref.letter];
  if(ref.type==='lib')return LIBRARY.find(w=>w.id===ref.id)||null;
  return null;
}
function workoutRef(ref){
  if(ref.type==='core'){const w=CORE2[ref.letter];return {name:w.name,sub:w.sub,key:'core'+ref.letter,struct:w,emphasis:w.emphasis,time:w.time,warmup:w.warmup,structured:true};}
  const w=LIBRARY.find(x=>x.id===ref.id);
  return {name:w.name,sub:w.cat,key:'lib'+w.id,struct:w,structured:true,time:w.time,warmup:w.warmup,quick:ref.quick};
}
function openSession(ref){SESSION=ref;TIMER.wkRef=ref;const wr=workoutRef(ref);TIMER.wkName=wr.name;SESS_ROUND=0;SESS_FEEL=null;cur='session';renderSession();}
function exLine(ex,tier,who){
  // who: null = her (uses current tier); member object = Nolan (kid lingo, foundation)
  let t=tier, kid=false;
  if(who){t=who.tier||'f';kid=who.kid;}
  let cell = ex[t] || ex.f;
  let q=cell.q||'';let w=cell.w?' @ '+cell.w:'';
  if(kid){const sub=ex.kidsub||kidify(`${q} ${ex.move}`);return sub;}
  // her line: move — qty @ weight, with easier-form note and low-impact swap
  let extras=[];
  if(cell.alt)extras.push(cell.alt);
  if(cell.lo)extras.push('low-impact: '+cell.lo);
  let line=`${ex.move} — ${q}${w}`;
  return {main:line, note:extras.join(' \u00B7 ')};
}

  if(wr.emphasis)r.appendChild(el('div','phase-tag',wr.emphasis));
  const hist=S.history[wr.key]||[];
  if(hist.length){const last=hist[0];r.appendChild(el('div','lasttime',`Last time \u00B7 ${fmtDate(last.d)} \u00B7 ${tierName(last.tier)}${last.feel?' \u00B7 '+last.feel:''}${last.note?' \u2014 \u201C'+esc(last.note)+'\u201D':''}`));}

  // STAGE 1 — WARM-UP (clear ADHD-friendly section)
  if(wr.warmup&&wr.warmup.length){
    r.appendChild(stageDivider('1','Warm-Up','~3 min \u00B7 ease in'));
    const wu=el('div','card warmup-card');let wh='<div class="card-in"><ul class="move-list warm">';
    wr.warmup.forEach(m=>wh+=`<li><span class="bullet">\u25C7</span><span>${esc(m)}</span></li>`);
    wh+='</ul></div>';wu.innerHTML=wh;r.appendChild(wu);
  }

  // STAGE 2 — THE WORK
  r.appendChild(stageDivider('2','The Work',wr.time||''));

    box.appendChild(rc);

      const hasT=!!EXERCISES[ex.move];

      if(me.note)h+=`<span class="mv-note">${esc(me.note)}</span>`;
      others.forEach(o=>{const ol=exLine(ex,S.tier,o);const txt=(typeof ol==='string')?ol:ol.main;if(txt)h+=`<span class="mv-other"><b>${esc(o.name)}</b> ${esc(txt)}</span>`;});
      h+=`</div>`;li.innerHTML=h;
      const tap=li.querySelector('.mv-tap');if(tap)tap.onclick=()=>openExerciseSheet(ex.move);
      ul.appendChild(li);});
    box.appendChild(ul);

    cr.onclick=()=>{if(SESS_ROUND<rounds-1){SESS_ROUND++;buzz(120);renderMoves();}else{SESS_ROUND=rounds;buzz(200);toast('All rounds done \u2014 finish below');renderMoves();}};
    const rest=el('button','btn ghost sm','Start Rest');

    ctrl.appendChild(cr);ctrl.appendChild(rest);box.appendChild(ctrl);
  }
  // STAGE 3 — FINISH & LOG
  r.appendChild(stageDivider('3','Finish','how did it feel?'));

  feels.forEach(f=>{const b=el('button','feel-btn'+(SESS_FEEL===f?' on':''),f);b.onclick=()=>{SESS_FEEL=SESS_FEEL===f?null:f;fr.querySelectorAll('.feel-btn').forEach(x=>x.classList.toggle('on',x.textContent===SESS_FEEL));};fr.appendChild(b);});
  r.appendChild(fr);

  const comp=el('button','btn','Complete & Log \u2713');comp.onclick=()=>completeSession(wr);r.appendChild(comp);
  refreshTimerUI();
}
function timerPanel(wr){const c=el('div','card timer-card');const fmt=(wr.format||'').toLowerCase();const c0=el('div','card-in');
  c0.innerHTML=`<div class="timer-modes"><button class="tm" data-m="up">Stopwatch</button><button class="tm" data-m="down">Countdown</button><button class="tm" data-m="interval">Intervals</button></div>
    <div class="timer-ring" id="tring"><div class="tphase" id="tphase"></div><div class="tdisp" id="tdisp">0:00</div></div>
    <div id="tconfig" class="timer-config"></div>
    <div class="timer-ctrl"><button class="btn ghost sm" id="treset">Reset</button><button class="btn sm" id="tstart">Start</button></div>`;
  c.appendChild(c0);
  setTimeout(()=>{c0.querySelectorAll('.tm').forEach(b=>{b.classList.toggle('on',TIMER.mode===b.dataset.m);
      b.onclick=()=>{unlockAudio();setTimerMode(b.dataset.m,b.dataset.m==='interval'?intervalGuess(fmt):{});c0.querySelectorAll('.tm').forEach(x=>x.classList.toggle('on',x===b));renderConfig();};});
    const sb=$('#tstart');if(sb)sb.onclick=()=>{if(!TIMER.mode)setTimerMode('up');unlockAudio();TIMER.running?timerStop():timerStart();};
    const rb=$('#treset');if(rb)rb.onclick=()=>timerReset();

function intervalGuess(fmt){if(fmt.includes('emom'))return {work:60,rest:0,rounds:20};if(fmt.includes('amrap'))return {work:1200,rest:0,rounds:1};return {work:40,rest:20,rounds:5};}
function renderConfig(){const box=$('#tconfig');if(!box)return;box.innerHTML='';
  if(TIMER.mode==='down')box.appendChild(stepper('Seconds',TIMER.target,[15,30,45,60,90,120],v=>{TIMER.target=v;TIMER.t=v;refreshTimerUI();}));

function stepper(label,val,opts,fn){const w=el('div','stepper');w.innerHTML=`<span class="st-lbl">${label}</span>`;const row=el('div','st-opts');

function completeSession(wr){const note=($('#snote')&&$('#snote').value.trim())||'';

function progCheckin(r){r.appendChild(el('div','phase-tag','How you feel matters most. Numbers are optional \u2014 track only what helps you.'));
  const last=S.checkins[0];
  if(last){const c=el('div','card');let h=`<div class="card-in"><div class="phase-tag">Latest \u00B7 ${fmtDate(last.d)}</div><div class="test-grid">`;
    CHECKIN_FIELDS.forEach(f=>{h+=`<div class="test-cell"><span class="tc-v">${last.v[f.key]?esc(last.v[f.key]):'\u2014'}</span><span class="tc-l">${f.name}</span></div>`;});h+=`</div></div>`;c.innerHTML=h;r.appendChild(c);
    if(S.checkins.length>1){r.appendChild(divider('Trend'));CHECKIN_FIELDS.forEach(f=>{const vals=S.checkins.slice(0,6).map(c=>parseFloat(c.v[f.key])).filter(x=>!isNaN(x)).reverse();
      if(vals.length>1){const row=el('div','trend-row');row.innerHTML=`<span class="tr-l">${f.name}</span>${spark(vals)}<span class="tr-now">${vals[vals.length-1]}</span>`;r.appendChild(row);}});}}
  else r.appendChild(el('p','empty','<span class="em-mk">No check-in yet. Log how you\u2019re feeling \u2014 that\u2019s the real measure.</span>'));
  const b=el('button','btn','Log Check-In');b.onclick=openCheckinSheet;r.appendChild(b);}
function spark(vals){const mn=Math.min(...vals),mx=Math.max(...vals),rng=mx-mn||1;return `<span class="spk">`+vals.map(v=>`<i style="height:${6+((v-mn)/rng)*16}px"></i>`).join('')+`</span>`;}
function openCheckinSheet(){let h=`<div class="ck" style="text-align:center">How are you?</div><p class="read" style="text-align:center;font-size:14px;color:var(--ink-soft)">Energy and mood matter most. Measurements are optional.</p>`;
  CHECKIN_FIELDS.forEach(f=>{h+=`<div class="field"><label>${f.name} <span style="color:var(--ink-soft)">(${f.unit})</span></label><input type="number" inputmode="decimal" data-k="${f.key}" placeholder="\u2014"></div>`;});
  sheet(h,[{t:'Save Check-In',primary:true,fn:()=>{const v={};document.querySelectorAll('.sheet input[data-k]').forEach(i=>v[i.dataset.k]=i.value.trim());S.checkins.unshift({d:Date.now(),v});save();closeSheet();toast('Saved \u2726');render();}}]);}

function progNolan(r){r.appendChild(el('div','phase-tag','Nolan joins your workouts in kid-friendly language. Add him from the Today screen, or do a Together challenge.'));
  const c=el('div','card');c.innerHTML=`<div class="card-in"><div class="mem-head"><span class="mem-name">Nolan</span><span class="chip">Kid \u00B7 Foundation</span></div><p class="yr-note">His moves are renamed to be fun and simple \u2014 \u201Ctoy squats,\u201D \u201Csuperhero reaches,\u201D \u201Cstrong board.\u201D Everything scales to his level automatically.</p></div>`;r.appendChild(c);
  const b=el('button','btn ghost sm','Try a Together Challenge');b.onclick=()=>{trainTab='together';go('train');};r.appendChild(b);}

function progSettings(r){r.appendChild(el('div','phase-tag','Set your default starting level. As you grow stronger, move it up \u2014 every workout will start there.'));
  r.appendChild(divider('Default Starting Level'));
  const tabs=el('div','tier-tabs big');['f','s','c'].forEach(t=>{const b=el('button','tier-tab'+(t===S.defaultTier?' on':''),tierName(t));b.onclick=()=>{S.defaultTier=t;S.tier=t;save();toast('Default set to '+tierName(t));render();};tabs.appendChild(b);});r.appendChild(tabs);
  r.appendChild(el('p','marker',S.defaultTier==='f'?'Foundation is a strong place to begin. Move up whenever it feels easy.':S.defaultTier==='s'?'Standard \u2014 you\u2019re building beautifully.':'Challenge \u2014 look how far you\u2019ve come.'));
  r.appendChild(divider('Your Data'));
  const exp=el('button','btn ghost sm','Export My Records');exp.onclick=exportData;r.appendChild(exp);
  const imp=el('button','btn ghost sm','Import / Restore');imp.onclick=importData;r.appendChild(imp);}

/* ============ LOG ============ */
function vLog(r){r.appendChild(el('div','eyebrow','Workbook & Legacy'));r.appendChild(el('h2','vtitle','The Record'));
  // gentle backup nudge — data is on-device, so prompt a backup periodically
  const daysSince=S.lastExport?Math.floor((Date.now()-S.lastExport)/86400000):999;
  if((!S.lastExport&&S.logs.length>=5)||(S.lastExport&&daysSince>=30&&S.logs.length>0)){
    const nudge=el('div','prompt-banner');
    nudge.innerHTML=`<span class="pi">\u26A0</span><span class="pt">Your records live <b>only on this phone</b>. Back them up so a new phone or cleared data won\u2019t lose your trail.</span>`;
    const nb=el('button','btn ghost sm','Back Up Now');nb.onclick=exportData;
    r.appendChild(nudge);r.appendChild(nb);
  }
  const wk=`c${S.cycle}w${S.week}`;const doneThis=['A','B','C'].filter(L=>S.completed[wk+L]).length;const total=Object.values(S.completed).filter(Boolean).length+S.logs.filter(l=>/with Nolan|Together|Hundred|Partner/.test(l.t)).length;
  const stat=el('div','card');stat.innerHTML=`<div class="card-in cyc"><div><div class="big">${doneThis}/3</div><div class="lbl">This week</div></div><div style="text-align:center"><div class="big">${S.momentum||0}</div><div class="lbl">Momentum</div></div><div style="text-align:right"><div class="big">${total}</div><div class="lbl">All-time</div></div></div>`;r.appendChild(stat);
  if((S.momentum||0)>0)r.appendChild(el('p','marker','You keep showing up. That\u2019s the whole secret. \u2726'));
  r.appendChild(divider('Your Log'));
  if(!S.logs.length)r.appendChild(el('p','empty','<span class="em-mk">Nothing here yet \u2014 your first workout starts the story.</span>'));
  else S.logs.slice(0,50).forEach(l=>{const e=el('div','log-entry');e.innerHTML=`<div class="le-date">${fmtDate(l.d)}</div><div class="le-body">${esc(l.t)}</div>`;r.appendChild(e);});
  r.appendChild(divider('Wins to Celebrate'));
  r.appendChild(el('div','phase-tag','Non-scale victories \u2014 the ones that really count.'));
  S.wins=S.wins||[];
  const wf=el('div','field');wf.innerHTML=`<input id="winn" placeholder="Climbed the stairs without getting winded\u2026">`;r.appendChild(wf);
  const wb=el('button','btn ghost sm','Add a Win');wb.onclick=()=>{const t=$('#winn').value.trim();if(!t)return;S.wins.unshift({d:Date.now(),t});save();render();};r.appendChild(wb);
  S.wins.slice(0,12).forEach(w=>{const e=el('div','log-entry');e.innerHTML=`<div class="le-date">${fmtDate(w.d)}</div><div class="le-body">\u2726 ${esc(w.t)}</div>`;r.appendChild(e);});}

/* ============ MANUAL ============ */
let openAcc=null;
function vManual(r){
  // title page
  const tp=el('div','manual-title');
  tp.innerHTML=`<div class="mt-crest">${CREST}</div>
    <div class="mt-name">Temple Fitness</div>
    <div class="mt-rule"><span></span>\u2756<span></span></div>
    <div class="mt-sub">Strength \u00B7 Grace \u00B7 Endurance</div>
    <div class="mt-tag">Strong, steady, and yours</div>`;
  r.appendChild(tp);

  // exercise guide — browsable tutorials
  r.appendChild(divider('Exercise Guide'));
  r.appendChild(el('div','phase-tag','Tap any move to see how it\u2019s done \u2014 with a simple picture, steps, and an easier option.'));
  const guide=el('div','ex-guide');
  Object.keys(EXERCISES).filter(n=>n!=='Dead Bug Core').sort().forEach(name=>{
    const ex=EXERCISES[name];const it=el('button','ex-guide-item');
    it.innerHTML=`<span class="egi-art">${ex.art}</span><span class="egi-name">${esc(name)}</span><span class="egi-arrow">\u203A</span>`;
    it.onclick=()=>openExerciseSheet(name);guide.appendChild(it);});
  r.appendChild(guide);

  // creed — ornamented
  const creed=el('div','creed-card');
  creed.innerHTML=`<div class="cc-head">\u2756 The Creed \u2756</div>`+CREED.map(l=>l?`<p>${l}</p>`:'<div class="cc-gap"></div>').join('');
  r.appendChild(creed);

  // the eight reminders
  r.appendChild(divider('Eight Reminders'));
  const rules=el('div','rules-list');
  RULEBOOK.forEach((x,i)=>{const row=el('div','rule-row');row.innerHTML=`<span class="rr-n">${String(i+1).padStart(2,'0')}</span><span class="rr-t">${x}</span>`;rules.appendChild(row);});
  r.appendChild(rules);

  // four pillars — cards
  r.appendChild(divider('Four Pillars'));
  const pg=el('div','pillar-grid');
  PILLARS.forEach(p=>{const c=el('div','pillar');c.innerHTML=`<div class="pl-name">${p[0]}</div><div class="pl-desc">${p[1]}</div>`;pg.appendChild(c);});
  r.appendChild(pg);

  // journey map — visual path
  r.appendChild(divider('The Journey'));
  const jm=el('div','journey');
  JOURNEY.forEach((j,i)=>{const step=el('div','jstep'+(i===0?' first':'')+(i===JOURNEY.length-1?' last':''));
    step.innerHTML=`<span class="js-dot"></span><div class="js-body"><span class="js-when">${j[0]}</span><span class="js-what">${j[1]}</span></div>`;jm.appendChild(step);});
  r.appendChild(jm);
  r.appendChild(el('p','manual-verse','Progress is not perfection. It is showing up, gently, again and again.'));

  // scripture / trail markers (from her STANDARDS)
  r.appendChild(divider('Trail Markers'));
  STANDARDS.forEach(m=>{const c=el('div','scripture');c.innerHTML=`<p>\u201C${esc(m[0])}\u201D</p><span class="sc-ref">\u2014 ${esc(m[1])}</span>`;r.appendChild(c);});

  // appendices — accordions
  r.appendChild(divider('Good to Know'));
  APPENDICES.forEach((a,i)=>r.appendChild(accordion(a.t,`<div class="read">`+a.b.map(b=>b?`<p>${esc(b)}</p>`:'<div style="height:6px"></div>').join('')+`</div>`,100+i)));

  r.appendChild(el('div','manual-commission'));
  r.querySelector('.manual-commission').innerHTML=`<div class="mc-rule">\u2756</div><p>Begin where you are.<br>Move with grace.<br>Keep showing up.</p>`;

  r.appendChild(divider('Your Data'));
  const exp=el('button','btn ghost sm','Export My Records');exp.onclick=exportData;r.appendChild(exp);
  const imp=el('button','btn ghost sm','Import / Restore');imp.onclick=importData;r.appendChild(imp);}
function accordion(title,html,id){const a=el('div','accordion'+(openAcc===id?' open':''));
  a.innerHTML=`<button class="acc-head">${title}<span class="ch">+</span></button><div class="acc-body"><div class="acc-body-in read">${html}</div></div>`;
  const body=a.querySelector('.acc-body');a.querySelector('.acc-head').onclick=()=>{const isOpen=a.classList.contains('open');
    document.querySelectorAll('.accordion.open').forEach(o=>{o.classList.remove('open');o.querySelector('.acc-body').style.maxHeight=null;});
    if(!isOpen){a.classList.add('open');body.style.maxHeight=body.scrollHeight+40+'px';openAcc=id;}else openAcc=null;};
  if(openAcc===id)setTimeout(()=>body.style.maxHeight=body.scrollHeight+40+'px',30);return a;}

/* ============ shared ============ */
function divider(t){const d=el('div','divider');d.innerHTML=t?`<span>${t}</span>`:'<span class="diamond">\u25C6</span>';return d;}
function stageDivider(num,title,sub){const d=el('div','stage-divider');d.innerHTML=`<span class="stage-num">${num}</span><span class="stage-ttl">${esc(title)}</span>${sub?`<span class="stage-sub">${esc(sub)}</span>`:''}`;return d;}
function addLog(t){S.logs.unshift({d:Date.now(),t});if(S.logs.length>300)S.logs.pop();save();}
function sheet(html,actions){closeSheet();const scrim=el('div','scrim');scrim.id='scrim';const s=el('div','sheet');s.innerHTML=`<div class="grab"></div>`+html;
  const act=el('div','sheet-actions');(actions||[]).forEach(a=>{const b=el('button','btn'+(a.primary?'':' ghost')+' sm',a.t);b.onclick=a.fn;act.appendChild(b);});s.appendChild(act);scrim.appendChild(s);scrim.onclick=e=>{if(e.target===scrim)closeSheet();};document.body.appendChild(scrim);}
function closeSheet(){const s=$('#scrim');if(s)s.remove();}
function openExerciseSheet(name){const ex=EXERCISES[name];if(!ex)return;
  let h=`<div class="ex-sheet"><div class="ex-art-wrap">${ex.art}</div>`;
  h+=`<div class="ex-name">${esc(name)}</div>`;
  h+=`<ol class="ex-steps">`+ex.steps.map(s=>`<li>${esc(s)}</li>`).join('')+`</ol>`;
  if(ex.cue)h+=`<div class="ex-cue"><span class="ex-cue-l">Form tip</span>${esc(ex.cue)}</div>`;
  if(ex.lo)h+=`<div class="ex-lo"><span class="ex-lo-l">Easier option</span>${esc(ex.lo)}</div>`;
  h+=`</div>`;
  sheet(h,[{t:'Got it',primary:true,fn:closeSheet}]);}
function exportData(){S.lastExport=Date.now();save();const data=JSON.stringify(S,null,2);const blob=new Blob([data],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='temple-athlete-records.json';a.click();URL.revokeObjectURL(url);toast('Records exported');}
function importData(){const inp=document.createElement('input');inp.type='file';inp.accept='application/json,.json';
  inp.onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const data=JSON.parse(rd.result);if(!data||typeof data!=='object')throw 0;S=Object.assign(S,data);save();toast('Records restored');render();}catch(err){toast('Could not read that file');}};rd.readAsText(f);};inp.click();}

  const items=[['today','Today',trailIco],['train','Train',dumbIco],['family','Progress',peopleIco],['log','Log',bookIco],['manual','Manual',scrollIco]];
  items.forEach(([v,l,ic])=>{const b=el('button','nav-btn'+(v==='today'?' on':''));b.dataset.v=v;b.innerHTML=`<span class="ni">${ic}</span><span class="nl">${l}</span>`;b.onclick=()=>go(v);nav.appendChild(b);});

  render();setTimeout(()=>{const sp=$('#splash');if(sp){sp.classList.add('gone');setTimeout(()=>sp.remove(),700);}},1100);}

/* ============ MOM + NOLAN TEAM CHALLENGE ============ */
let TEAM=null; // {id, done:{me:{},nolan:{}}}
function trainTogether(r){
  r.appendChild(el('div','phase-tag','A fun challenge to do with Nolan. Split the reps, fill the bars, finish as a team.'));
  if(!TEAM){
    r.appendChild(divider('Choose a Challenge'));
    TEAM_CHALLENGES.forEach(p=>{const c=el('div','card');c.style.cursor='pointer';
      c.innerHTML=`<div class="card-in"><div class="ck">${esc(p.name)}</div><div class="ck-sub">${esc(p.sub)}</div><p class="yr-note">${esc(p.blurb)}</p></div>`;
      c.onclick=()=>{const done={me:{},nolan:{}};p.movements.forEach(m=>{done.me[m.key]=0;done.nolan[m.key]=0;});TEAM={id:p.id,done};render();};
      r.appendChild(c);});
    r.appendChild(el('p','marker','Cheer each other on. Moving together counts double.'));
    return;
  }
  const plan=TEAM_CHALLENGES.find(p=>p.id===TEAM.id);
  r.appendChild(divider(plan.name));
  // team totals
  const tot=el('div','card framed');let th=`<div class="card-in"><div class="ck" style="text-align:center">Team Progress</div><div class="murph-tot">`;
  plan.movements.forEach(m=>{const done=TEAM.done.me[m.key]+TEAM.done.nolan[m.key];const pct=Math.min(100,Math.round(done/m.total*100));
    th+=`<div class="mt-row"><div class="mt-head"><span>${esc(m.name)}</span><span class="mt-num">${done} / ${m.total}</span></div><div class="mt-bar"><i style="width:${pct}%"></i></div></div>`;});
  th+=`</div></div>`;tot.innerHTML=th;r.appendChild(tot);
  // per-person tappers (Mom + Nolan)
  r.appendChild(divider('Add Reps'));
  [['me','Mom'],['nolan','Nolan']].forEach(([id,nm])=>{const c=el('div','card');let h=`<div class="card-in"><div class="mem-head"><span class="mem-name">${nm}</span></div><div class="murph-add">`;
    plan.movements.forEach(m=>{const label=id==='nolan'?kidify(m.name):m.name;
      h+=`<div class="ma-grp"><span class="ma-l">${esc(label)} <b>${TEAM.done[id][m.key]}</b></span><div class="ma-btns"><button data-id="${id}" data-k="${m.key}" data-n="-5">-5</button><button data-id="${id}" data-k="${m.key}" data-n="5">+5</button><button data-id="${id}" data-k="${m.key}" data-n="10">+10</button></div></div>`;});
    h+=`</div></div>`;c.innerHTML=h;
    c.querySelectorAll('button').forEach(b=>b.onclick=()=>{const i=b.dataset.id,k=b.dataset.k,n=parseInt(b.dataset.n);TEAM.done[i][k]=Math.max(0,TEAM.done[i][k]+n);
      const allDone=plan.movements.every(m=>TEAM.done.me[m.key]+TEAM.done.nolan[m.key]>=m.total);if(allDone)buzz(200);render();});
    r.appendChild(c);});
  const allDone=plan.movements.every(m=>TEAM.done.me[m.key]+TEAM.done.nolan[m.key]>=m.total);
  if(allDone)r.appendChild(el('p','marker','\u2726 You did it together! \u2726'));
  const fin=el('button','btn'+(allDone?'':' ghost')+' sm','Finish & Log');
  fin.onclick=()=>{const parts=plan.movements.map(m=>`${TEAM.done.me[m.key]+TEAM.done.nolan[m.key]} ${m.name}`).join(' \u00B7 ');addLog(`${plan.name} with Nolan \u00B7 ${parts}`);S.momentum=(S.momentum||0)+1;TEAM=null;toast('Logged \u2014 great teamwork \u2726');save();render();};
  r.appendChild(fin);
  const reset=el('button','btn ghost sm','Choose Different Challenge');reset.onclick=()=>{TEAM=null;render();};r.appendChild(reset);
}
